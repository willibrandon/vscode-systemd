name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan for secrets
        uses: willibrandon/picket@4c9f7d28260bfe0a7334865c84db093519f6f57f # v0.2.12
        with:
          cache-mode: secret-hash-only
          fail-on: findings
          redact: 100
          timeout: 300

  quality:
    name: Quality and bundles
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - run: npm ci
      - run: npm run verify
      - name: Stage verified bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-bundles
          path: |
            dist/browser.js
            dist/browserServer.js
            dist/extension.cjs
            dist/metafile.json
            dist/nodeServer.cjs
            dist/test/web/index.cjs
          if-no-files-found: error
          retention-days: 3

  package:
    name: Package exact VSIX
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - run: npm ci
      - name: Consume verified bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-bundles
          path: dist
      - run: npm run check:bundles
      - run: npm run check:licenses
      - run: npm run check:package
      - run: npm run package:artifacts
      - run: npm run check:release-reproducibility
      - run: npm run test:vsix:prepared
      - name: Stage candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: |
            dist/*.vsix
            dist/*.sha256
            dist/*.cdx.json
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Desktop (${{ matrix.os }}, VS Code ${{ matrix.vscode }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        vscode: [1.102.0, stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - run: npm ci
      - run: npm run test:integration
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}

  web:
    name: Browser Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - run: npm ci
      - run: npm run test:web

  upstream:
    name: Pinned upstream conformance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out extension source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out pinned systemd source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: systemd/systemd
          ref: 15458a89f1e39223c958f9ba06f4355b7d60a3ed
          path: .systemd-upstream
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned Podman source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: podman-container-tools/podman
          ref: e14fafc21edcbd691ffbb5cab2d541d18de43838
          path: .podman-upstream
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned mkosi source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: systemd/mkosi
          ref: 583dcb0e16bb74ecaa45edc3afaaddb1e7312307
          path: .mkosi-upstream
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - run: npm ci
      - name: Re-extract and compare all pinned upstream language data
        run: npm run check:generated
        env:
          SYSTEMD_SOURCE: ${{ github.workspace }}/.systemd-upstream
          PODMAN_SOURCE: ${{ github.workspace }}/.podman-upstream
          MKOSI_SOURCE: ${{ github.workspace }}/.mkosi-upstream
      - name: Verify upstream identities, revisions, and trees
        run: npm run check:upstream
        env:
          SYSTEMD_SOURCE: ${{ github.workspace }}/.systemd-upstream
          PODMAN_SOURCE: ${{ github.workspace }}/.podman-upstream
          MKOSI_SOURCE: ${{ github.workspace }}/.mkosi-upstream
      - name: Parse pinned upstream configuration fixtures
        run: npm run check:upstream:corpus
        env:
          SYSTEMD_SOURCE: ${{ github.workspace }}/.systemd-upstream
          PODMAN_SOURCE: ${{ github.workspace }}/.podman-upstream
          MKOSI_SOURCE: ${{ github.workspace }}/.mkosi-upstream

  insiders:
    name: VS Code Insiders early warning
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - run: npm ci
      - run: npm run test:integration
        env:
          VSCODE_VERSION: insiders

  remote_ssh:
    name: Remote SSH host
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - run: npm ci
      - name: Consume the exact release-candidate VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: dist
      - run: npm run test:remote:prepared
      - name: Upload remote extension-host evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remote-ssh-smoke
          path: dist/remote-smoke
          if-no-files-found: error
          retention-days: 7
