name: Docs

on:
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "docs-site/**"
      - "media/icon.png"
      - "package.json"
      - "package-lock.json"
      - "scripts/test-docs-popup.mjs"
      - "syntaxes/*.tmLanguage.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "docs-site/**"
      - "media/icon.png"
      - "package.json"
      - "package-lock.json"
      - "scripts/test-docs-popup.mjs"
      - "syntaxes/*.tmLanguage.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm

      - run: npm ci

      - name: Build and upload docs
        uses: withastro/action@e84f40bd8d2caa9e768ec82ad30dd81f0b280853 # v6.1.2
        with:
          path: docs-site
          node-version: 24.19.0
          package-manager: npm@12.0.2

      - name: Verify image popups across viewports
        run: node ./scripts/test-docs-popup.mjs

  deploy:
    name: Deploy docs
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
