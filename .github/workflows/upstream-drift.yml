name: Upstream drift

on:
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out extension source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out systemd
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: systemd/systemd
          path: .systemd-upstream
          persist-credentials: false
      - name: Check out Podman
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: containers/podman
          path: .podman-upstream
          persist-credentials: false
      - name: Check out mkosi
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: systemd/mkosi
          path: .mkosi-upstream
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - name: Regenerate from current upstream heads
        run: npm run generate
        env:
          SYSTEMD_SOURCE: ${{ github.workspace }}/.systemd-upstream
          PODMAN_SOURCE: ${{ github.workspace }}/.podman-upstream
          MKOSI_SOURCE: ${{ github.workspace }}/.mkosi-upstream
      - name: Report whether review is required
        run: >-
          git diff --exit-code -- data/upstream.lock.json
          packages/language-core/src/generated/registry.json
