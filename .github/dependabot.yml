version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Los_Angeles
    groups:
      npm-development:
        dependency-type: development
        update-types: [minor, patch]
      npm-runtime:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Keep compile-time API types aligned with engines.vscode. Raise both
      # deliberately when the minimum supported VS Code version changes.
      - dependency-name: "@types/vscode"
      # Keep Node types aligned with the supported Node 24 toolchain.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:30"
      timezone: America/Los_Angeles
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
      day: monday
      time: "11:00"
      timezone: America/Los_Angeles
    ignore:
      # Toolchain versions are coordinated with the repository's other pins.
      # Dependabot may still refresh the digest behind each exact tag.
      - dependency-name: node
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: docker
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: mcr.microsoft.com/devcontainers/base
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
